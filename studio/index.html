<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HZ3 Studio</title>
<link rel="stylesheet" href="/hz3/studio/static/studio.css">
</head>
<body>
<header class="bar">
  <strong class="brand">HZ3 Studio</strong>
  <button id="toggle-song" title="Mostrar u ocultar el panel de la canción">Canción</button>
  <select id="project-list" title="Proyectos guardados"></select>
  <input id="project-name" placeholder="nombre del proyecto" maxlength="64">
  <button id="save-project">Guardar</button>
  <label class="file" title="Abre .mixmash desde tu disco">Abrir .mixmash<input id="import-package" type="file" accept=".mixmash"></label>
  <button id="download-package" title="Descarga el paquete con audio, letra, ABC y estado de la app">Descargar .mixmash</button>
  <label class="file" title="Canción de origen a analizar">Audio original<input id="source-audio" type="file" accept="audio/*"></label>
  <button id="analyze" title="SheetSage2 (ABC) + Whisper (letra) + MixMash (estilo)">Analizar audio</button>
  <button id="compose" title="YuE2 compone el ABC (melodía y acordes) a partir del estilo y la letra">Generar ABC (YuE2)</button>
  <label class="file" title="JSON con style, lyrics y abc">Importar JSON<input id="import-json" type="file" accept=".json"></label>
  <span class="spacer"></span>
  <label class="switch"><input id="harmonize" type="checkbox" checked> Armonías</label>
  <button id="arrange" title="El agente decide en qué secciones y con qué voces van las armonías">Armonías con agente</button>
  <button id="render-song" class="primary">Generar canción</button>
  <button id="export-mix">Exportar WAV</button>
</header>

<div id="status" class="status"><span id="status-text">Listo.</span><progress id="status-progress" max="1" value="0"></progress></div>

<main>
  <aside class="song">
    <label>Indicaciones de estilo (MixMash)<textarea id="style-instructions" rows="3" placeholder="p. ej. intro en piano, romántico, big band después del solo"></textarea></label>
    <label>Estilo<textarea id="style" rows="6"></textarea></label>
    <label>Letra (si está vacía al analizar, se transcribe con Whisper)<textarea id="lyrics" rows="12"></textarea></label>
    <label>ABC<textarea id="abc" rows="8" spellcheck="false"></textarea></label>
    <div class="row">
      <label>Semilla<input id="seed" type="number" min="0" value="60"></label>
      <label>Modo<select id="mode"><option>full</option><option>melody</option></select></label>
    </div>
    <details>
      <summary>Avanzado</summary>
      <label>Checkpoint<select id="ckpt"></select></label>
      <div class="row">
        <label>Temperatura<input id="temperature" type="number" step="0.05" value="0.9"></label>
        <label>top_p<input id="top_p" type="number" step="0.01" value="0.95"></label>
      </div>
      <div class="row">
        <label>top_k<input id="top_k" type="number" value="100"></label>
        <label>Penalización<input id="repetition_penalty" type="number" step="0.01" value="1.2"></label>
        <label>CFG<input id="cfg_scale" type="number" step="0.1" value="2.0"></label>
      </div>
      <label>Modelo del agente (Ollama)<input id="arranger-model" value="deepseek-v4.1-flash:cloud"></label>
      <label>Indicaciones para el agente<textarea id="arranger-instructions" rows="3" placeholder="p. ej. coros a cappella en el último coro"></textarea></label>
    </details>
  </aside>

  <section class="editor">
    <div class="transport">
      <button id="play">▶</button>
      <button id="stop">■</button>
      <span id="clock">0:00 / 0:00</span>
      <label class="zoom">Zoom<input id="zoom" type="range" min="2" max="40" value="6"></label>
    </div>
    <div id="timeline" class="timeline">
      <div id="lanes" class="lanes"></div>
      <div id="playhead" class="playhead"></div>
    </div>
    <div id="inspector" class="inspector hidden">
      <h3 id="inspector-title"></h3>
      <p id="section-arrangement" class="note"></p>
      <div class="row">
        <label>Nombre<input id="section-name" maxlength="100"></label>
        <button id="section-split" title="Divide la sección en el compás del cursor">Dividir en el cursor</button>
        <button id="section-merge">Unir con la siguiente</button>
      </div>
      <label>Letra de la sección<textarea id="section-lyrics" rows="6"></textarea></label>
      <div class="row">
        <label>Semilla de la sección<input id="section-seed" type="number" min="0"></label>
        <button id="section-dice" title="Semilla nueva">🎲</button>
      </div>
      <div id="section-takes" class="takes"></div>
      <button id="render-section" class="primary">Regenerar sección</button>
    </div>
  </section>
</main>
<script src="/hz3/studio/static/studio.js"></script>
</body>
</html>
